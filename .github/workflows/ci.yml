name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: services/api/go.mod, cache-dependency-path: services/api/go.sum }
      - run: go vet ./...
      - run: go test ./...

  ai:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/ai } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  # Every commit in a pull request must be written and signed off by a
  # person on the team. Agent co-author lines and generated-by footers fail.
  authorship:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check commit authors and trailers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            msg=$(git log -1 --format=%B "$c")
            who=$(git log -1 --format='%an <%ae>' "$c")
            if echo "$msg" | grep -qiE '^(co-authored-by|claude-session):.*(claude|anthropic|copilot|openai|gpt|gemini|cursor|devin|codex|\[bot\]|agent)|^claude-session:|generated with .*(claude|copilot|chatgpt)'; then
              echo "::error::$c has an AI co-author or generated-by line"; bad=1
            fi
            if echo "$who" | grep -qiE 'anthropic|claude|\[bot\]|copilot|openai'; then
              echo "::error::$c is authored by $who, commits must be your own"; bad=1
            fi
          done
          exit $bad
