server {
  listen 80;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Compress text responses: the JS bundle shrinks to about a quarter on the
  # wire, which is most of the first load on a phone. API JSON is compressed
  # too (gzip_proxied any) unless the API already did it.
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml application/xml;

  # Resolve the API at request time so nginx starts even before the API is up.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

  location /api/ {
    set $api ${API_UPSTREAM};
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Hashed build output never changes under the same name.
  location /assets/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Face models are large and only change with a deploy; cache them for a day.
  location /models/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # index.html must always be revalidated so a deploy is picked up at once.
  location / {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
